<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Breakfast & Snack Planner</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weekly Breakfast & Snack Planner</h1>
            <p class="subtitle">Balanced, preservative-free meals with your 7-a-day</p>
        </header>

        <button id="generate-btn">Generate Weekly Plan</button>

        <div id="week-plan" class="hidden">
            <nav class="day-tabs" id="day-tabs"></nav>

            <div id="day-content"></div>

            <section class="shopping-list-section" id="shopping-section">
                <div class="shopping-header" id="shopping-header">
                    <h2>Weekly Shopping List <span id="shopping-progress" class="shopping-progress"></span></h2>
                    <span id="shopping-toggle" class="toggle-arrow">&#9660;</span>
                </div>
                <div id="shopping-list" class="shopping-list"></div>
            </section>

            <div class="badge-row">
                <span class="badge no-preservatives">No Preservatives</span>
                <span class="badge no-emulsifiers">No Emulsifiers</span>
                <span class="badge whole-foods">Whole Foods Only</span>
            </div>
        </div>
    </div>

    <script src="app.js?v=11"></script>
</body>
</html>
